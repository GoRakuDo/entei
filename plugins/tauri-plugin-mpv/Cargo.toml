[package]
name = "tauri-plugin-mpv"
links = "tauri-plugin-mpv"
version = "0.1.0"
description = "libmpv dynamic-loading playback bridge for Entei"
authors = ["GoRakuDo"]
edition = "2021"

[lib]
name = "tauri_plugin_mpv"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libmpv is loaded at runtime (`libmpv-2.dll` / `libmpv.so`) instead of being
# linked, so the app still starts on machines that never installed mpv.
libloading = "0.8"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
