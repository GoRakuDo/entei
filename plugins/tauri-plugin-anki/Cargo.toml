[package]
name = "tauri-plugin-anki"
links = "tauri-plugin-anki"
version = "0.1.0"
description = "Native AnkiConnect client plugin for Entei"
authors = ["GoRakuDo"]
edition = "2021"

[lib]
name = "tauri_plugin_anki"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Validates storeMediaFile's data URI-free base64 payload at the native boundary.
base64 = "0.22"
# The AnkiConnect client talks to a loopback HTTP endpoint from the Rust
# process, so the browser's Private Network Access preflight and its CORS
# checks never run: the request never leaves the native side of the app.
# `rustls-tls` keeps the TLS stack away from the platform's OpenSSL, matching
# the other native plugins of this project.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# `tokio::join!` runs the independent deck/model listing calls concurrently;
# Tokio's DNS and timed stream reads enforce the endpoint and response bounds.
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }

[dev-dependencies]
# The integration tests run a mock AnkiConnect server on a loopback socket.
tokio = { version = "1", features = ["macros", "net", "io-util", "rt", "time"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
