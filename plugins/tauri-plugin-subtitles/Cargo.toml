[package]
name = "tauri-plugin-subtitles"
links = "tauri-plugin-subtitles"
version = "0.1.0"
description = "Native subtitle parsing, media filename parsing and LazySync offset estimation for Entei"
authors = ["GoRakuDo"]
edition = "2021"

[lib]
name = "tauri_plugin_subtitles"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The media filename parser is a direct port of the TypeScript implementation,
# whose behaviour is defined by a set of regular expressions (bracket tags,
# year tags, release-info parentheses, quality vocabulary, episode markers).
# `fancy-regex` is used because two of them need look-around
# (`(?<![A-Za-z])` on the E/EP episode marker and the bare-number marker),
# which the linear-time `regex` crate does not support.
fancy-regex = "0.14"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
