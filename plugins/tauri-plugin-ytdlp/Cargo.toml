[package]
name = "tauri-plugin-ytdlp"
links = "tauri-plugin-ytdlp"
version = "0.1.0"
description = "yt-dlp media extraction plugin for Entei"
authors = ["GoRakuDo"]
edition = "2021"

[lib]
name = "tauri_plugin_ytdlp"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `net` + `io-util` are required by the loopback Range relay (TCP listener and
# streaming response bodies); `macros`/`rt-multi-thread` cover the relay tests.
tokio = { version = "1", features = [
    "process",
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
    "fs",
    "time",
    "net",
    "io-util",
] }
# Range proxy: `stream` gives us the chunked upstream body, `rustls-tls` avoids
# depending on the platform TLS stack (and on OpenSSL being installed).
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "rustls-tls",
] }
axum = "0.8"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
