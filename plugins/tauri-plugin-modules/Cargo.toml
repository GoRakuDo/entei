[package]
name = "tauri-plugin-modules"
links = "tauri-plugin-modules"
version = "0.1.0"
description = "Unified native Entei Modules plugin for yt-dlp, torrent, Jimaku, Nadeshiko, and Yomitan"
authors = ["GoRakuDo"]
edition = "2021"

[lib]
name = "tauri_plugin_modules"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Yomitan dictionary ZIP import (term/kanji/meta/tag banks are DEFLATE entries).
# `default-features = false` keeps only DEFLATE: bzip2/zstd/lzma/ppmd/AES are
# never used by Yomitan dictionaries and would add C build steps per platform.
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
# `zip` pulls `flate2` with `default-features = false` and no backend selected,
# which fails to compile. Selecting the pure-Rust backend here (Cargo unifies
# features) keeps the build free of a C zlib / libz-ng toolchain on every target.
flate2 = { version = "1", features = ["rust_backend"] }
# Dictionary storage: a dedicated `yomitan-dictionaries.db`, fully separate from
# the user database. `bundled` compiles SQLite from source (no system
# libsqlite3), so the same crate builds for Windows and Android/Termux.
rusqlite = { version = "0.33", features = ["bundled"] }
httpdate = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
# `AddTorrent::TorrentFileBytes` takes `bytes::Bytes`: the magnet metadata is
# resolved once (list_only) and re-added from those bytes when the user picks
# files, so the info dictionary never has to be fetched twice.
bytes = "1"
# Loopback Range relay + async runtime for torrent and yt-dlp.
axum = "0.8"
tokio = { version = "1", features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "fs",
    "macros",
    "time",
    "net",
    "io-util",
    "process",
] }
tokio-util = { version = "0.7", features = ["io"] }
librqbit = { version = "9.1", default-features = false, features = [
    "default-tls",
] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread", "time"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }