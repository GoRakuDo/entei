[package]
name = "tauri-plugin-modules"
links = "tauri-plugin-modules"
version = "0.1.0"
description = "Native Jimaku and Nadeshiko API clients for Entei"
authors = ["GoRakuDo"]
edition = "2021"

[lib]
name = "tauri_plugin_modules"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httpdate = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread", "time"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
