[package]
name = "tauri-plugin-torrent"
links = "tauri-plugin-torrent"
version = "0.1.0"
description = "librqbit torrent session bridge for Entei"
authors = ["GoRakuDo"]
edition = "2021"

[lib]
name = "tauri_plugin_torrent"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `AddTorrent::TorrentFileBytes` takes `bytes::Bytes`: the magnet metadata is
# resolved once (list_only) and re-added from those bytes when the user picks
# files, so the info dictionary never has to be fetched twice.
bytes = "1"
# `net` + `io-util` are required by the loopback Range relay (TCP listener,
# seeking/streaming file bodies); `rt-multi-thread`/`macros` cover the tests.
tokio = { version = "1", features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "fs",
    "macros",
    "time",
    "net",
    "io-util",
] }
# Loopback Range relay for selected torrent files.
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
librqbit = { version = "8.1", default-features = false, features = ["default-tls"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
