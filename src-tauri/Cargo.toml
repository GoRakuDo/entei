[package]
name = "entei"
version = "0.1.0"
description = "Entei desktop application"
authors = ["GoRakuDo"]
edition = "2021"

[lib]
name = "entei_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-ytdlp = { path = "../plugins/tauri-plugin-ytdlp" }
tauri-plugin-torrent = { path = "../plugins/tauri-plugin-torrent" }
