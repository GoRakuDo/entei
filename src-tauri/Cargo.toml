[package]
name = "entei"
version = "0.1.0"
description = "Entei desktop application"
authors = ["GoRakuDo"]
edition = "2021"

[lib]
name = "entei_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is required by `app.security.assetProtocol` in
# tauri.conf.json: a native dialog pick has no `File`, so the HTML timing shim
# mounts the same file through the asset protocol while libmpv opens the path.
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-modules = { path = "../plugins/tauri-plugin-modules" }
tauri-plugin-mpv = { path = "../plugins/tauri-plugin-mpv" }
# Native subtitle parsing, media filename parsing and LazySync offset
# estimation: the CPU-bound work that used to run on the browser main thread.
tauri-plugin-subtitles = { path = "../plugins/tauri-plugin-subtitles" }
tauri-plugin-anki = { path = "../plugins/tauri-plugin-anki" }
# Embedded SQLite persistence: single `entei.db` replacing the browser
# IndexedDB / localStorage stores (timeline, history, sessions, archive,
# profile, KV settings).
tauri-plugin-database = { path = "../plugins/tauri-plugin-database" }
tauri-plugin-mcp-bridge = "0.13.2"
tauri-plugin-dialog = "2"
open = "5.4"
