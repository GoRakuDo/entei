[package]
name = "entei"
version = "0.1.0"
description = "Entei desktop application"
authors = ["GoRakuDo"]
edition = "2021"

[lib]
name = "entei_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is required by `app.security.assetProtocol` in
# tauri.conf.json: a native dialog pick has no `File`, so the HTML timing shim
# mounts the same file through the asset protocol while libmpv opens the path.
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-ytdlp = { path = "../plugins/tauri-plugin-ytdlp" }
tauri-plugin-torrent = { path = "../plugins/tauri-plugin-torrent" }
tauri-plugin-mpv = { path = "../plugins/tauri-plugin-mpv" }
tauri-plugin-mcp-bridge = "0.13.2"
tauri-plugin-dialog = "2"
